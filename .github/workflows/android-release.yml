name: Android release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate required secrets
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          ANDROID_KEYSTORE_JKS: ${{ secrets.ANDROID_KEYSTORE_JKS }}
        run: |
          for secret_name in LOCAL_PROPERTIES ANDROID_KEYSTORE_JKS; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required secret: $secret_name" >&2
              exit 1
            fi
          done

      - name: Configure signing and local properties
        run: |
          printf "%s" "${{ secrets.LOCAL_PROPERTIES }}" > local.properties
          printf "%s" "${{ secrets.ANDROID_KEYSTORE_JKS }}" | tr -d "\r\n" | base64 --decode > androidApp/android-keystore.jks

      - name: Read release metadata
        id: release_metadata
        run: |
          verCode="$(tr -d '\r\n' < version.txt | xargs)"
          verName="$((verCode / 100)).$((verCode % 100))"
          tagName="android-v${verName}-build.${GITHUB_RUN_NUMBER}"

          echo "verCode=$verCode" >> "$GITHUB_OUTPUT"
          echo "verName=$verName" >> "$GITHUB_OUTPUT"
          echo "tagName=$tagName" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: ./gradlew androidApp:assembleReleaseGithub --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pano-voice-scrobbler-android-universal
          path: dist/pano-scrobbler-android-universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_metadata.outputs.tagName }}
          target_commitish: ${{ github.sha }}
          name: Pano Voice Scrobbler ${{ steps.release_metadata.outputs.verName }} (build ${{ github.run_number }})
          body: |
            Signed Android APK generated by GitHub Actions.

            Version name: `${{ steps.release_metadata.outputs.verName }}`
            Version code: `${{ steps.release_metadata.outputs.verCode }}`
            Commit: `${{ github.sha }}`
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
          files: dist/pano-scrobbler-android-universal.apk
